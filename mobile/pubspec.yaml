name: transtu
description: Application de signalement transport public Transtu.
publish_to: "none"
version: 1.0.0+1

environment:
  sdk: ">=3.0.0 <4.0.0"

dependencies:
  flutter:
    sdk: flutter

  # Environment
  flutter_dotenv: ^5.1.0

  app_links : ^6.3.0
  # Network
  dio: ^5.4.0

  # Navigation
  go_router: ^13.0.0

  # State management
  flutter_riverpod: ^2.5.0
  riverpod_annotation: ^2.3.0

  # Storage
  shared_preferences: ^2.2.0

  # QR Scanner
  mobile_scanner: ^5.0.0

  # Media
  image_picker: ^1.0.7

  # UI
  google_fonts: ^6.1.0
  flutter_animate: ^4.5.0

  # Utils
  intl: ^0.19.0
  dartz: ^0.10.1
  connectivity_plus: ^6.0.0
  cached_network_image: ^3.3.0
  permission_handler: ^11.3.0
  webview_flutter: ^4.14.1

dev_dependencies:
  flutter_test:
    sdk: flutter
  build_runner: ^2.4.0
  riverpod_generator: ^2.3.0
  flutter_lints: ^3.0.0
  
flutter:
  uses-material-design: true
  assets:
    - .env
    - assets/images/
